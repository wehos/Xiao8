name: Build Desktop App (Cross-Platform)

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0-beta.1)'
        required: false
        default: ''
        type: string
      electron_repo:
        description: 'Electron frontend repo (owner/repo)'
        required: false
        default: 'Project-N-E-K-O/N.E.K.O.-PC'
        type: string
      electron_ref:
        description: 'Electron repo branch/tag/commit'
        required: false
        default: 'main'
        type: string
      skip_signing:
        description: 'Skip code signing'
        required: false
        default: 'true'
        type: string
      windows_only:
        description: 'Build only the Windows backend and desktop app'
        required: false
        default: false
        type: boolean
      previous_portable_release:
        description: 'Release tag used as the Portable delta baseline'
        required: false
        default: ''
        type: string
      allow_fork_build:
        description: 'Allow this workflow to run outside the upstream repository'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 0 * * *'   # Daily at 8 AM Beijing time (00:00 UTC)
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0-beta.1)'
        required: false
        default: ''
      electron_repo:
        description: 'Electron frontend repo (owner/repo)'
        required: false
        default: 'Project-N-E-K-O/N.E.K.O.-PC'
      electron_ref:
        description: 'Electron repo branch/tag/commit'
        required: false
        default: 'main'
      skip_signing:
        description: 'Skip code signing'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      previous_portable_release:
        description: 'Release tag used as the Portable delta baseline'
        required: false
        default: ''
      allow_fork_build:
        description: 'Allow this workflow to run outside the upstream repository'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-desktop-nightly-release
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  # Anonymous embedding profile id (compatibility contract — bumped only when
  # the upstream weights/tokenizer become incompatible with previously-cached
  # vectors). The repo + revision together pin the actual artifacts.
  EMBEDDING_MODEL_REPO: jinaai/jina-embeddings-v5-text-nano-retrieval
  EMBEDDING_MODEL_PROFILE_ID: local-text-retrieval-v1
  EMBEDDING_MODEL_REVISION: ac5d898c8d382b17167c33e5c8af644a3519b47d

jobs:
  # ──────────────────────────────────────────────
  # Step 0: Calculate version
  # ──────────────────────────────────────────────
  version:
    if: github.repository == 'Project-N-E-K-O/N.E.K.O' || inputs.allow_fork_build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: calc
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            COMMIT_SHORT=$(git rev-parse --short HEAD)
            DATE=$(date +%Y%m%d)
            VERSION="${DATE}-${COMMIT_SHORT}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

  # ──────────────────────────────────────────────
  # Step 1: Build Python backend with Nuitka
  # ──────────────────────────────────────────────
  build-python:
    if: github.repository == 'Project-N-E-K-O/N.E.K.O' || inputs.allow_fork_build
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"os":"windows-latest","platform":"win","artifact_name":"python-backend-win","output_binary":"projectneko_server.exe","expect_arch":"x64","expect_platform":"win"}]' || '[{"os":"windows-latest","platform":"win","artifact_name":"python-backend-win","output_binary":"projectneko_server.exe","expect_arch":"x64","expect_platform":"win"},{"os":"macos-15-intel","platform":"mac-x64","python_arch":"x64","artifact_name":"python-backend-mac-x64","output_binary":"projectneko_server","expect_arch":"x64","expect_platform":"mac"},{"os":"macos-latest","platform":"mac-arm64","artifact_name":"python-backend-mac-arm64","output_binary":"projectneko_server","expect_arch":"arm64","expect_platform":"mac"},{"os":"ubuntu-latest","platform":"linux","artifact_name":"python-backend-linux","output_binary":"projectneko_server","expect_arch":"x64","expect_platform":"linux"},{"os":"ubuntu-24.04-arm","platform":"linux-arm64","artifact_name":"python-backend-linux-arm64","output_binary":"projectneko_server","experimental":true,"expect_arch":"arm64","expect_platform":"linux","nuitka_ldflags":"-fuse-ld=lld"}]') }}

    runs-on: ${{ matrix.os }}
    # 试验性矩阵项（linux-arm64）单独失败时不把整个 job 判红：nightly 发布的门是
    # `needs.build-python.result == 'success'`，arm64 这条腿一红，正式的
    # win / mac / linux-x64 产物就会跟着一起不发布。
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 300
    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch || '' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install dependencies
        shell: bash
        run: |
          uv venv .venv
          # Embedding runtime deps (onnxruntime, tokenizers; CPU SIMD detect
          # reads numpy's __cpu_features__, no py-cpuinfo) are in
          # [project.dependencies] now — plain `uv sync` covers both the
          # build-time prepare step and the bundled runtime.
          # `--group galgame` adds the local rapidocr-pillow fork for the
          # bundled OCR backend without the opencv/shapely dependency chain.
          # Remove the legacy distribution before reinstalling the renamed SDK:
          # both distributions own the same bilibili_api/ import package, so an
          # incremental environment can otherwise retain old metadata and module
          # files. Reinstalling afterwards restores every shared file from the
          # selected dev SDK.
          uv pip uninstall --python .venv bilibili-api-python || true
          uv sync --group galgame --reinstall-package bilibili-api-dev
          uv pip install --python .venv nuitka ordered-set zstandard

      - name: Verify Bilibili SDK dependency convergence
        shell: bash
        run: |
          VENV_PYTHON=".venv/bin/python"
          if [ -f ".venv/Scripts/python.exe" ]; then
            VENV_PYTHON=".venv/Scripts/python.exe"
          fi
          "$VENV_PYTHON" - <<'PY'
          from importlib import metadata

          installed = {
              str(dist.metadata.get("Name", "")).lower(): dist.version
              for dist in metadata.distributions()
              if "bilibili-api" in str(dist.metadata.get("Name", "")).lower()
          }
          expected = {"bilibili-api-dev": "18.0.0a1"}
          if installed != expected:
              raise SystemExit(
                  "Bilibili SDK environment is not clean: "
                  f"expected {expected}, found {installed}. "
                  "Run uv sync --reinstall-package bilibili-api-dev to remove "
                  "legacy bilibili-api-python files."
              )

          from bilibili_api.login_v2 import QrCodeLogin, QrCodeLoginEvents

          assert QrCodeLogin is not None
          assert QrCodeLoginEvents is not None
          PY

      - name: Prepare filtered built-in plugins for Nuitka
        shell: bash
        run: |
          VENV_PYTHON=".venv/bin/python"
          if [ -f ".venv/Scripts/python.exe" ]; then
            VENV_PYTHON=".venv/Scripts/python.exe"
          fi
          "$VENV_PYTHON" scripts/prepare_nuitka_plugins.py prepare

      # --- Generate runtime config files (not tracked in git) ---
      - name: Generate default config files
        shell: bash
        run: |
          python -c "
          import json, os
          # 本地化角色种子在 config/characters/<locale>.json（已入库的目录，PR #1282），
          # 不需在此生成；只补 git 不跟踪的运行时文件，让构建有可读的基准配置。
          configs = {
            'config/characters.json': {'主人': {'档案名': '', '性别': '', '昵称': ''}, '猫娘': {}, '当前猫娘': ''},
            # coreApi/assistApi = free 是发给新用户的出厂默认（空 {} 会让新装用户
            # 没有默认服务商）；密钥字段一律不写，保持种子无密钥。
            'config/core_config.json': {'coreApi': 'free', 'assistApi': 'free'},
            'config/user_preferences.json': [],
          }
          for path, data in configs.items():
            if not os.path.exists(path):
              with open(path, 'w', encoding='utf-8') as f:
                json.dump(data, f, ensure_ascii=False, indent=2)
              print(f'Created {path}')
          "
          # Copy browser_use prompt .md templates from installed package
          mkdir -p data/browser_use_prompts
          VENV_PYTHON=".venv/bin/python"
          if [ -f ".venv/Scripts/python.exe" ]; then
            VENV_PYTHON=".venv/Scripts/python.exe"
          fi
          $VENV_PYTHON -c "
          import shutil
          from pathlib import Path
          import browser_use.agent.system_prompts as sp
          src = Path(sp.__file__).parent
          dst = Path('data/browser_use_prompts')
          dst.mkdir(parents=True, exist_ok=True)
          bad = [md.name for md in src.glob('*.md') if not md.name.isascii()]
          if bad:
              # Non-ASCII basenames under Contents/MacOS/ make codesign emit a
              # hex-literal identifier and the whole bundle then fails to seal.
              # scripts/check_no_nonascii_asset_names.py cannot see this one:
              # data/ is gitignored and the analyze job installs no dependencies,
              # so the names only exist here, right after generation.
              raise SystemExit(
                  'non-ASCII browser_use prompt template name(s), which break '
                  f'macOS signing: {bad}'
              )
          for md in src.glob('*.md'):
              shutil.copy2(md, dst / md.name)
              print(f'Copied {md.name}')
          "
          echo "=== browser_use_prompts ==="
          ls -la data/browser_use_prompts/
          echo "Default config files and directories ready."

      # --- Platform-specific system dependencies ---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            portaudio19-dev \
            patchelf \
            ccache
          # AArch64 的 BL/B 指令跳转半径只有 ±128MB。Nuitka 把 7859 个目标文件链成
          # 一个可执行文件时 .text 已经超过这个半径，而 GNU ld 不会自动补
          # range-extension thunk，于是链接期报 R_AARCH64_CALL26 relocation
          # truncated（linux-arm64 这条腿自 #3040 加进来起就一直卡在这里）。lld 的
          # AArch64 后端会自动插 thunk，所以 arm64 改用 lld 链接；注入点是下面
          # Nuitka 步骤的 LDFLAGS（矩阵字段 nuitka_ldflags）。
          if [ "$(uname -m)" = "aarch64" ]; then
            sudo apt-get install -y --no-install-recommends lld
          fi

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install ccache portaudio || true

      # --- Pre-install Playwright Chromium for bundle ---
      - name: Install Playwright Chromium (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p playwright_browsers
          PLAYWRIGHT_BROWSERS_PATH="$(pwd)/playwright_browsers" \
            .venv/bin/python -m playwright install chromium || \
            echo "[WARNING] Playwright Chromium install failed; will download on first run."

      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "playwright_browsers")) { New-Item -ItemType Directory -Path "playwright_browsers" }
          $env:PLAYWRIGHT_BROWSERS_PATH = "${{ github.workspace }}\playwright_browsers"
          .venv\Scripts\python.exe -m playwright install chromium
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Playwright Chromium install failed; will download on first run."
          }

      # --- Prepare local embedding model assets (cross-platform) ---
      # Mirrors the upstream Hugging Face repo at a pinned revision into the
      # anonymous profile folder so the bundled app can run vector memory
      # offline. The runtime (memory/embeddings.py) auto-falls back to bundled
      # assets when the user's app-data profile is incomplete.
      # Cache the weights by revision so huggingface.co is hit at most once per
      # pin (per OS) instead of every build — the same per-IP HTTP 429 throttle
      # that broke the Docker build can bite here too. Cache hit -> the next step
      # is a no-op ("keep existing"); only a cold cache actually downloads.
      - name: Cache embedding model weights
        uses: actions/cache@v4
        with:
          path: data/embedding_models
          key: embedding-model-${{ runner.os }}-${{ env.EMBEDDING_MODEL_REVISION }}-both

      - name: Prepare embedding model assets
        shell: bash
        run: |
          VENV_PYTHON=".venv/bin/python"
          if [ -f ".venv/Scripts/python.exe" ]; then
            VENV_PYTHON=".venv/Scripts/python.exe"
          fi
          $VENV_PYTHON scripts/prepare_embedding_model.py \
            --repo "$EMBEDDING_MODEL_REPO" \
            --revision "$EMBEDDING_MODEL_REVISION" \
            --profile-id "$EMBEDDING_MODEL_PROFILE_ID" \
            --output-root data/embedding_models \
            --variant both

      - name: Cache voice-turn model weights
        uses: actions/cache@v4
        with:
          path: main_logic/asr_client/endpointing/models/*.onnx
          key: voice-turn-models-v2-${{ runner.os }}-${{ hashFiles('main_logic/asr_client/endpointing/models/manifest.json') }}

      - name: Prepare verified voice-turn assets
        shell: bash
        run: uv run --no-sync python scripts/prepare_voice_turn_assets.py

      - name: Cache CAM++ speaker model weight
        uses: actions/cache@v4
        with:
          path: main_logic/asr_client/speaker_shadow/models/*.onnx
          key: speaker-shadow-campplus-v1-${{ runner.os }}-${{ hashFiles('main_logic/asr_client/speaker_shadow/models/manifest.json') }}

      - name: Prepare verified CAM++ speaker model
        shell: bash
        run: uv run --no-sync python scripts/prepare_speaker_model.py

      # --- Warm tiktoken o200k_base cache for offline use (PR #929) ---
      # tiktoken downloads encoding blobs (~1.5 MB each) on first use into
      # TIKTOKEN_CACHE_DIR; without warming, the bundled app would either
      # need network at startup or fall back to the heuristic counter.
      # launcher.py points TIKTOKEN_CACHE_DIR at data/tiktoken_cache when it
      # exists in the bundle.
      - name: Warm tiktoken cache (o200k_base)
        shell: bash
        run: |
          mkdir -p data/tiktoken_cache
          VENV_PYTHON=".venv/bin/python"
          if [ -f ".venv/Scripts/python.exe" ]; then
            VENV_PYTHON=".venv/Scripts/python.exe"
          fi
          TIKTOKEN_CACHE_DIR="$(pwd)/data/tiktoken_cache" \
            $VENV_PYTHON -c "import tiktoken; tiktoken.get_encoding('o200k_base')"
          echo "=== tiktoken_cache ==="
          ls -la data/tiktoken_cache/

      - name: Set up Node.js for frontend builds
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build production frontend projects
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ./build_frontend.sh
            bash scripts/verify_frontend_build.sh
            exit 0
          fi
          uv run --no-sync python scripts/unpack_builtin_pngtuber.py
          # 内置 Live2D 模型：Linux 分支由 build_frontend.sh 解压，这里是绕过那个脚本
          # 的 Windows/macOS 路径，必须自己解一次，否则 --include-data-dir=static 打进
          # dist 的 static/ 里没有默认模型（check_nuitka_dist 会把这种情况判红）。
          for model in yui-origin yui-lolita; do
            rm -rf "static/$model"
            tar -xzmf "assets/$model.tar.gz" -C static/
            test -f "static/$model/$model.moc3"
          done
          cd frontend/plugin-manager
          npm ci
          npm run build-only
          cd ../react-neko-chat
          npm ci
          npm run build

      # --- Build with Nuitka ---
      - name: Build with Nuitka (Unix)
        if: runner.os != 'Windows'
        shell: bash
        # Nuitka 的 scons 后端原生继承 LDFLAGS/CCFLAGS（生效时日志里会打印
        # `Scons: Inherited LDFLAGS=...`），所以不用改 nuitka 命令行就能只给某一条腿
        # 注入链接器/优化级别。目前只有 linux-arm64 带 nuitka_ldflags；其余四条腿两个
        # 字段都不存在，展开成空串，行为不变。若 lld 仍压不住 CALL26 溢出，下一级杠杆
        # 是给该腿补 "nuitka_ccflags":"-Os"（gcc 取最后一个 -O，能盖过 Nuitka 自己加的
        # -O3），矩阵里加一个字段即可，不用再动这里。
        env:
          LDFLAGS: ${{ matrix.nuitka_ldflags || '' }}
          CCFLAGS: ${{ matrix.nuitka_ccflags || '' }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # PyObjC Foundation/AppKit refuse Nuitka's plain standalone mode.
            # Keep the backend as a background app bundle; the packaging step
            # below adds a stable bin/projectneko_server wrapper for Electron.
            NUITKA_OPTS="--mode=app --macos-app-mode=background"
          else
            NUITKA_OPTS="--standalone"
          fi
          NUITKA_OPTS="$NUITKA_OPTS --output-dir=dist"
          NUITKA_OPTS="$NUITKA_OPTS --output-filename=projectneko_server"

          # Config data files
          NUITKA_OPTS="$NUITKA_OPTS --include-data-files=config/__init__.py=config/__init__.py"
          NUITKA_OPTS="$NUITKA_OPTS --include-data-files=config/api_providers.json=config/api_providers.json"
          NUITKA_OPTS="$NUITKA_OPTS --include-data-files=config/characters.json=config/characters.json"
          # 本地化角色种子在 config/characters/<locale>.json（PR #1282 后），ConfigManager.
          # _get_localized_characters_source 按 locale 读该目录；打整个目录，别再引用已不存在的
          # 根级 config/characters.<locale>.json（旧路径，会静默丢失全部本地化种子）。
          NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=config/characters=config/characters"
          NUITKA_OPTS="$NUITKA_OPTS --include-data-files=config/core_config.json=config/core_config.json"
          NUITKA_OPTS="$NUITKA_OPTS --include-data-files=config/user_preferences.json=config/user_preferences.json"
          # changelog/.md 与 survey/.json 是纯数据文件，--include-package=config 只编 .py
          # 不带它们，必须显式 include-data-dir，否则打包后 /api/changelog 与 /api/survey
          # 读不到内容（survey 是 Steam-only，正是只在打包构建里跑）。
          NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=config/changelog=config/changelog"
          NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=config/surveys=config/surveys"

          # Data directories
          NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=assets=assets"
          NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=templates=templates"
          NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=data/browser_use_prompts=data/browser_use_prompts"
          # Plugin manager UI (vite dist; gitignored)
          if [ -d "frontend/plugin-manager/dist" ]; then
            NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=frontend/plugin-manager/dist=frontend/plugin-manager/dist"
          else
            echo "[WARNING] frontend/plugin-manager/dist missing; /ui will be empty in bundle."
          fi
          # Built-in plugin data is installed from the filtered stage after
          # compilation. Nuitka intentionally refuses to treat .py as data.
          # macOS: skip bundling playwright_browsers (Chromium .app path has spaces
          # that break Nuitka's xattr call; browser will download on first run)
          if [[ "$RUNNER_OS" != "macOS" ]]; then
            NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=playwright_browsers=playwright_browsers"
          fi
          if [ -d "data/tiktoken_cache" ]; then
            NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=data/tiktoken_cache=data/tiktoken_cache"
          fi
          if [ -d "data/embedding_models" ]; then
            NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=data/embedding_models=data/embedding_models"
          fi
          NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=main_logic/asr_client/endpointing/models=main_logic/asr_client/endpointing/models"
          NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=main_logic/asr_client/speaker_shadow/models=main_logic/asr_client/speaker_shadow/models"
          NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=static=static"
          # 应用内 OpenClaw 引导文档 + 图片，由 agent_router 经 /api/agent/openclaw/guide/* 提供；
          # 是纯数据目录，--include-package 不带，漏了引导页内容/图片打包后 404。
          NUITKA_OPTS="$NUITKA_OPTS --include-data-dir=docs/zh-CN/guide=docs/zh-CN/guide"

          # Packages
          NUITKA_OPTS="$NUITKA_OPTS --include-package=uvicorn"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=fastapi"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=starlette"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=jinja2"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=websockets"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=app"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=config"
          # The generated launcher carries selective --nofollow-import-to
          # directives derived from each plugin's [tool.neko.build] rules.
          NUITKA_OPTS="$NUITKA_OPTS --include-package=plugin"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=brain"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=main_logic"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=main_routers"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=memory"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=utils"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=steamworks"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=browser_use"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=browser_use_sdk"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=playwright"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=tiktoken"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=tiktoken_ext"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=onnxruntime"
          # onnxruntime.transformers/ is a benchmark + model-conversion toolbox
          # nothing at runtime imports (rapidocr uses only the core InferenceSession).
          # --include-package=onnxruntime would recurse and compile the whole subtree,
          # including a 130k+ line gpt2 benchmark C unit that crashes the C backend.
          # Synced with build_nuitka.bat.
          NUITKA_OPTS="$NUITKA_OPTS --nofollow-import-to=onnxruntime.transformers"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=tokenizers"
          # The bilibili_danmaku plugin imports bilibili_api; compile the
          # package itself (CI previously only carried its package-data).  The
          # dev SDK imports these transitive packages from login_v2/__init__ at
          # runtime, so list them explicitly rather than relying on Nuitka's
          # optional-import discovery.
          NUITKA_OPTS="$NUITKA_OPTS --include-package=bilibili_api"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=Cryptodome"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=chompjs"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=frozendict"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=qrcode"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=qrcode_terminal"
          # Marketplace Galgame native OCR/vision cohort. Installed on every platform
          # by `uv sync --group galgame` (local rapidocr-pillow fork + pyclipper).
          # Nuitka's auto-follow misses their data files, so include package +
          # data explicitly.
          NUITKA_OPTS="$NUITKA_OPTS --include-package=rapidocr_onnxruntime"
          NUITKA_OPTS="$NUITKA_OPTS --include-package-data=rapidocr_onnxruntime"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=pyclipper"
          NUITKA_OPTS="$NUITKA_OPTS --include-package=mss"
          # dxcam is Windows-only (win32 marker); it's handled in the Windows cmd
          # build step and is never installed here, so it's intentionally omitted.

          # Package data
          NUITKA_OPTS="$NUITKA_OPTS --include-package-data=audiolab"
          NUITKA_OPTS="$NUITKA_OPTS --include-package-data=pyrnnoise"
          NUITKA_OPTS="$NUITKA_OPTS --include-package-data=browser_use"
          # NOTE: do NOT use --include-package-data=playwright here,
          # Nuitka's built-in playwright plugin handles driver/node automatically
          # and adding package-data would conflict with the exe at the same path.
          NUITKA_OPTS="$NUITKA_OPTS --include-package-data=jinja2"
          NUITKA_OPTS="$NUITKA_OPTS --include-package-data=certifi"
          NUITKA_OPTS="$NUITKA_OPTS --include-package-data=bilibili_api"

          # Exclusions
          NUITKA_OPTS="$NUITKA_OPTS --nofollow-import-to=audiolab"
          NUITKA_OPTS="$NUITKA_OPTS --nofollow-import-to=pyrnnoise"
          NUITKA_OPTS="$NUITKA_OPTS --nofollow-import-to=matplotlib"
          NUITKA_OPTS="$NUITKA_OPTS --nofollow-import-to=pytest"

          # Plugin & CI flags
          NUITKA_OPTS="$NUITKA_OPTS --enable-plugin=dill-compat"
          NUITKA_OPTS="$NUITKA_OPTS --assume-yes-for-downloads"

          # Steam files (include if present in repo).
          # PR #1264 moved native libs into steamworks/; runtime still loads them
          # from the exe sibling dir (see steamworks/__init__.py), so dest stays at root.
          # Gate by RUNNER_OS: all platforms' libs are checked into the repo, but
          # feeding a Linux ELF .so to a macOS Nuitka build trips an arch-mismatch FATAL.
          # The --include-package=steamworks above also makes Nuitka pick up every
          # native lib in steamworks/ as package data, so strip the wrong-platform
          # copies from the source tree before invoking nuitka.
          NUITKA_OPTS="$NUITKA_OPTS --include-data-files=steam_appid.txt=steam_appid.txt"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            rm -f steamworks/SteamworksPy.so steamworks/libsteam_api.so \
                  steamworks/SteamworksPy64.dll steamworks/steam_api64.dll steamworks/steam_api64.lib
            if [ -f "steamworks/libsteam_api.dylib" ]; then
              NUITKA_OPTS="$NUITKA_OPTS --include-data-files=steamworks/libsteam_api.dylib=libsteam_api.dylib"
            fi
            if [ -f "steamworks/SteamworksPy.dylib" ]; then
              NUITKA_OPTS="$NUITKA_OPTS --include-data-files=steamworks/SteamworksPy.dylib=SteamworksPy.dylib"
            fi
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            rm -f steamworks/SteamworksPy.dylib steamworks/libsteam_api.dylib \
                  steamworks/SteamworksPy64.dll steamworks/steam_api64.dll steamworks/steam_api64.lib
            # 仓库里的 Steam .so 只有 x86-64 一份，喂给 arm64 runner 上的 Nuitka
            # 会撞上和 macOS 分支同一个 arch-mismatch FATAL；Steam 也没有 arm64
            # Linux 客户端，所以在非 x86_64 的 Linux 上整块剥掉、不打包。
            if [[ "$(uname -m)" != "x86_64" ]]; then
              rm -f steamworks/SteamworksPy.so steamworks/libsteam_api.so
            fi
            if [ -f "steamworks/libsteam_api.so" ]; then
              NUITKA_OPTS="$NUITKA_OPTS --include-data-files=steamworks/libsteam_api.so=libsteam_api.so"
            fi
            if [ -f "steamworks/SteamworksPy.so" ]; then
              NUITKA_OPTS="$NUITKA_OPTS --include-data-files=steamworks/SteamworksPy.so=SteamworksPy.so"
            fi
          fi

          echo "=== Nuitka options ==="
          echo "$NUITKA_OPTS" | tr ' ' '\n'
          echo "======================"

          .venv/bin/python -m nuitka $NUITKA_OPTS build_nuitka_launcher.py

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set NUITKA_OPTS=--standalone --output-dir="dist" --output-filename="projectneko_server.exe"
          set NUITKA_OPTS=%NUITKA_OPTS% --windows-icon-from-ico=assets/icon.ico
          set NUITKA_OPTS=%NUITKA_OPTS% --company-name="Project N.E.K.O."
          set NUITKA_OPTS=%NUITKA_OPTS% --product-name="N.E.K.O. AI Assistant"
          set NUITKA_OPTS=%NUITKA_OPTS% --file-version=1.0.0.0
          set NUITKA_OPTS=%NUITKA_OPTS% --product-version=1.0.0.0
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-files=config/__init__.py=config/__init__.py
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-files=config/api_providers.json=config/api_providers.json
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-files=config/characters.json=config/characters.json
          rem 本地化角色种子是 config/characters 目录下按 locale 命名的 json（en.json 等，PR #1282 后）；
          rem 打整个目录，别再引用 PR #1282 前已不存在的根级 config.characters.locale.json 旧路径。
          rem （cmd 的 rem 行会把尖括号当重定向解析，注释里一律不用尖括号）
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=config/characters=config/characters
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-files=config/core_config.json=config/core_config.json
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-files=config/user_preferences.json=config/user_preferences.json
          rem changelog/.md 与 survey/.json 是纯数据，--include-package=config 不带，须显式打包
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=config/changelog=config/changelog
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=config/surveys=config/surveys
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=assets=assets
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=templates=templates
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=data/browser_use_prompts=data/browser_use_prompts
          if not exist "frontend\plugin-manager\dist" echo [WARNING] frontend\plugin-manager\dist missing; /ui will be empty in bundle.
          if exist "frontend\plugin-manager\dist" set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=frontend/plugin-manager/dist=frontend/plugin-manager/dist
          rem Built-in plugin payload is copied from the filtered stage after Nuitka.
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=playwright_browsers=playwright_browsers
          if exist "data\tiktoken_cache" set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=data/tiktoken_cache=data/tiktoken_cache
          if exist "data\embedding_models" set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=data/embedding_models=data/embedding_models
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=main_logic/asr_client/endpointing/models=main_logic/asr_client/endpointing/models
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=main_logic/asr_client/speaker_shadow/models=main_logic/asr_client/speaker_shadow/models
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=static=static
          rem 应用内 OpenClaw 引导文档 + 图片，由 agent_router 经 /api/agent/openclaw/guide/* 提供；
          rem 纯数据目录，漏了引导页内容/图片打包后 404。
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-dir=docs/zh-CN/guide=docs/zh-CN/guide
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=uvicorn
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=fastapi
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=starlette
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=jinja2
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=websockets
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=app
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=config
          rem The generated launcher excludes Python modules filtered by each
          rem plugin's [tool.neko.build] rules while --include-package compiles
          rem the remaining dynamically imported built-in modules.
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=plugin
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=brain
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=main_logic
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=main_routers
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=memory
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=utils
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=steamworks
          rem PR #1264 moved native libs into steamworks/; runtime still loads them
          rem from the exe sibling dir (see steamworks/__init__.py), so dest stays at root.
          rem Guard with `if exist` to mirror the Unix branch — keeps the build
          rem soft on incidental missing libs instead of fataling in Nuitka.
          rem --include-package=steamworks pulls in every native lib in steamworks/
          rem as package data; strip the non-Windows copies so Nuitka can't trip
          rem an arch check on them (mirrors the Unix branch's rm step).
          del /q steamworks\SteamworksPy.so steamworks\libsteam_api.so steamworks\SteamworksPy.dylib steamworks\libsteam_api.dylib 2>nul
          if exist "steamworks\steam_api64.dll" set NUITKA_OPTS=%NUITKA_OPTS% --include-data-files=steamworks/steam_api64.dll=steam_api64.dll
          if exist "steamworks\steam_api64.lib" set NUITKA_OPTS=%NUITKA_OPTS% --include-data-files=steamworks/steam_api64.lib=steam_api64.lib
          if exist "steamworks\SteamworksPy64.dll" set NUITKA_OPTS=%NUITKA_OPTS% --include-data-files=steamworks/SteamworksPy64.dll=SteamworksPy64.dll
          set NUITKA_OPTS=%NUITKA_OPTS% --include-data-files=steam_appid.txt=steam_appid.txt
          set NUITKA_OPTS=%NUITKA_OPTS% --nofollow-import-to=audiolab
          set NUITKA_OPTS=%NUITKA_OPTS% --nofollow-import-to=pyrnnoise
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package-data=audiolab
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package-data=pyrnnoise
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=browser_use
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package-data=browser_use
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=browser_use_sdk
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=playwright
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package-data=playwright
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=tiktoken
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=tiktoken_ext
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=onnxruntime
          rem onnxruntime.transformers/ is a benchmark + model-conversion toolbox
          rem nothing at runtime imports (rapidocr uses only the core InferenceSession).
          rem --include-package=onnxruntime would recurse and compile the whole subtree,
          rem including a 130k+ line gpt2 benchmark C unit that crashes the C backend.
          rem Synced with build_nuitka.bat.
          set NUITKA_OPTS=%NUITKA_OPTS% --nofollow-import-to=onnxruntime.transformers
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=tokenizers
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package-data=jinja2
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package-data=certifi
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=bilibili_api
          rem bilibili-api-dev login_v2 imports these transitive packages at runtime.
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=Cryptodome
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=chompjs
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=frozendict
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=qrcode
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=qrcode_terminal
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package-data=bilibili_api
          rem Marketplace Galgame native OCR/vision cohort (uv sync --group galgame:
          rem local rapidocr-pillow fork + pyclipper; mss/dxcam from main deps).
          rem Nuitka auto-follow misses their data files, so include package + data.
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=rapidocr_onnxruntime
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package-data=rapidocr_onnxruntime
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=pyclipper
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=mss
          set NUITKA_OPTS=%NUITKA_OPTS% --include-package=dxcam
          set NUITKA_OPTS=%NUITKA_OPTS% --enable-plugin=dill-compat
          set NUITKA_OPTS=%NUITKA_OPTS% --nofollow-import-to=matplotlib
          set NUITKA_OPTS=%NUITKA_OPTS% --nofollow-import-to=pytest
          set NUITKA_OPTS=%NUITKA_OPTS% --windows-console-mode=force
          set NUITKA_OPTS=%NUITKA_OPTS% --assume-yes-for-downloads

          .venv\Scripts\python.exe -m nuitka %NUITKA_OPTS% build_nuitka_launcher.py

      # --- Rename Nuitka output directory ---
      - name: Rename build output
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" && -d "dist/build_nuitka_launcher.app" ]]; then
            mkdir -p dist/Xiao8
            mv dist/build_nuitka_launcher.app dist/Xiao8/projectneko_server.app
            {
              echo '#!/bin/sh'
              echo 'SCRIPT_DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)'
              echo 'exec "$SCRIPT_DIR/projectneko_server.app/Contents/MacOS/projectneko_server" "$@"'
            } > dist/Xiao8/projectneko_server
            chmod +x dist/Xiao8/projectneko_server
            RUNTIME_DIR="dist/Xiao8/projectneko_server.app/Contents/MacOS"
          elif [ -d "dist/build_nuitka_launcher.dist" ]; then
            mv dist/build_nuitka_launcher.dist dist/Xiao8
            RUNTIME_DIR="dist/Xiao8"
          else
            echo "::error::Nuitka output directory not found"
            exit 1
          fi
          echo "NEKO_NUITKA_RUNTIME_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"
          # macOS: playwright_browsers was excluded from Nuitka (xattr bug with
          # spaces in .app paths), copy it manually into the output directory
          if [[ "$RUNNER_OS" == "macOS" && -d "playwright_browsers" ]]; then
            # This tree lands under Contents/MacOS/, where codesign treats every
            # file as nested code; a non-ASCII basename becomes a hex-literal
            # identifier and the whole bundle then fails to seal. The payload is
            # downloaded, so scripts/check_no_nonascii_asset_names.py structurally
            # cannot see it — the only place to look is right here, before the copy.
            # Files only: a CJK *directory* holding ASCII files seals fine
            # (verified against a real Developer ID cert; see the checker's
            # module docstring), and failing on it would block the build for nothing.
            # One physical line on purpose: `python -c` rejects a first line that
            # starts with whitespace, and a YAML block scalar cannot carry the
            # column-0 lines a multi-line form would need.
            .venv/bin/python -c "import sys; from pathlib import Path; bad = [str(p) for p in Path('playwright_browsers').rglob('*') if p.is_file() and not p.name.isascii()]; sys.exit('non-ASCII name(s) in playwright_browsers, which break macOS signing: ' + repr(bad[:10])) if bad else None"
            cp -R playwright_browsers "$RUNTIME_DIR/playwright_browsers"
            echo "Copied playwright_browsers into $RUNTIME_DIR/"
          fi
          VENV_PYTHON=".venv/bin/python"
          if [ -f ".venv/Scripts/python.exe" ]; then
            VENV_PYTHON=".venv/Scripts/python.exe"
          fi
          "$VENV_PYTHON" scripts/prepare_nuitka_plugins.py install \
            --destination-dir "$RUNTIME_DIR/plugin/plugins"
          echo "=== Build output ==="
          ls -la dist/Xiao8/ || echo "dist/Xiao8 not found!"

      - name: Smoke test frozen Owner voice identity runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NEKO_VOICE_IDENTITY_RELEASE_SMOKE = "1"
          $stdout = Join-Path $env:RUNNER_TEMP "voice-identity-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "voice-identity-smoke.stderr.log"
          $process = Start-Process `
            -FilePath "dist/Xiao8/projectneko_server.exe" `
            -WindowStyle Hidden `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          $timedOut = -not $process.WaitForExit(120000)
          if ($timedOut) {
            taskkill.exe /PID $process.Id /T /F | Out-Host
            $process.WaitForExit()
          }
          $stdoutText = if (Test-Path -LiteralPath $stdout) {
            Get-Content -LiteralPath $stdout -Raw
          } else { "" }
          $stderrText = if (Test-Path -LiteralPath $stderr) {
            Get-Content -LiteralPath $stderr -Raw
          } else { "" }
          Write-Host $stdoutText
          if ($stderrText) { Write-Host $stderrText }
          if ($timedOut) {
            throw "Frozen Owner voice identity smoke timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "Frozen Owner voice identity smoke exited with $($process.ExitCode)"
          }
          if ($stdoutText -notmatch "NEKO_VOICE_IDENTITY_RELEASE_SMOKE_OK") {
            throw "Frozen Owner voice identity smoke success marker missing"
          }

      # --- Verify bundled embedding + tiktoken assets ---
      # memory/embeddings.py treats every onnx_data sidecar plus both fp32
      # and int8 variants as required at session-load time; tiktoken
      # o200k_base must also be present so utils.tokenize doesn't fall
      # back to the heuristic counter. Use -s (non-empty) so a zero-byte
      # file from an interrupted download fails the build, matching
      # prepare_embedding_model.py's own non-empty contract.
      - name: Verify bundled offline assets
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$NEKO_NUITKA_RUNTIME_DIR" ]; then
            echo "::error::$NEKO_NUITKA_RUNTIME_DIR not found, cannot verify"
            exit 1
          fi
          embedding_required=(
            "tokenizer.json"
            "onnx/model.onnx"
            "onnx/model.onnx_data"
            "onnx/model_quantized.onnx"
            "onnx/model_quantized.onnx_data"
          )
          missing=0
          for rel in "${embedding_required[@]}"; do
            if [ ! -s "$NEKO_NUITKA_RUNTIME_DIR/data/embedding_models/$EMBEDDING_MODEL_PROFILE_ID/$rel" ]; then
              echo "::error::missing or empty bundled embedding asset: $rel"
              missing=1
            fi
          done
          if ! ls "$NEKO_NUITKA_RUNTIME_DIR/data/tiktoken_cache/" 2>/dev/null | grep -q .; then
            echo "::error::data/tiktoken_cache empty in bundle (o200k_base would re-download at runtime)"
            missing=1
          fi
          endpointing_assets="$NEKO_NUITKA_RUNTIME_DIR/main_logic/asr_client/endpointing/models"
          for rel in manifest.json THIRD_PARTY_NOTICES.md silero_vad.onnx smart_turn_v3.onnx; do
            if [ ! -s "$endpointing_assets/$rel" ]; then
              echo "::error::missing or empty bundled endpointing asset: $rel"
              missing=1
            fi
          done
          if [ -e "$NEKO_NUITKA_RUNTIME_DIR/data/vad_models" ]; then
            echo "::error::obsolete data/vad_models must not be packaged"
            missing=1
          fi
          endpointing_weight_count="$(find "$NEKO_NUITKA_RUNTIME_DIR" -type f \( -name silero_vad.onnx -o -name smart_turn_v3.onnx \) | wc -l | tr -d ' ')"
          if [ "$endpointing_weight_count" -ne 2 ]; then
            echo "::error::endpointing weights must be packaged exactly once"
            missing=1
          fi
          uv run --no-sync python scripts/prepare_voice_turn_assets.py \
            --asset-dir "$endpointing_assets" --offline || missing=1
          speaker_shadow_assets="$NEKO_NUITKA_RUNTIME_DIR/main_logic/asr_client/speaker_shadow/models"
          for rel in manifest.json THIRD_PARTY_NOTICES.md campplus-zh-en-advanced.onnx; do
            if [ ! -s "$speaker_shadow_assets/$rel" ]; then
              echo "::error::missing or empty bundled CAM++ asset: $rel"
              missing=1
            fi
          done
          if [ -e "$NEKO_NUITKA_RUNTIME_DIR/data/speaker_models" ]; then
            echo "::error::obsolete data/speaker_models must not be packaged"
            missing=1
          fi
          speaker_weight_count="$(find "$NEKO_NUITKA_RUNTIME_DIR" -type f -name campplus-zh-en-advanced.onnx | wc -l | tr -d ' ')"
          if [ "$speaker_weight_count" -ne 1 ]; then
            echo "::error::CAM++ weight must be packaged exactly once"
            missing=1
          fi
          uv run --no-sync python scripts/prepare_speaker_model.py \
            --asset-dir "$speaker_shadow_assets" --offline || missing=1
          [ "$missing" -eq 0 ]

      # --- Generic dist invariant check ---
      # Catches the broader class of "Nuitka silently dropped a required
      # asset" bugs: missing config/, static/, plugin/plugins, frontend
      # build output, or built-in plugin.toml files. See
      # scripts/check_nuitka_dist.py for the full asset list and rationale.
      - name: Verify Nuitka dist invariants
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv/Scripts/python.exe scripts/check_nuitka_dist.py dist/Xiao8 --plugin-stage build/nuitka-plugins
          else
            .venv/bin/python scripts/check_nuitka_dist.py "$NEKO_NUITKA_RUNTIME_DIR" --plugin-stage build/nuitka-plugins
          fi

      # 产物架构闸门（#2898）。`macos-15` 是 Apple Silicon 镜像，mac-x64 那条腿曾经在
      # 它上面构建，`actions/setup-python` 的 architecture: x64 只让 Python 走 Rosetta，
      # Nuitka 照样吐 arm64，Playwright 也按宿主架构下成了 chrome-mac-arm64 —— 整整几个
      # 月的 Intel Mac 版都启动不了，而流水线全绿。runner 已换成 macos-15-intel，这一步
      # 是防它（以及任何一条腿）再无声地跑偏：不匹配就直接红，不上传。
      - name: Verify dist CPU architecture
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv/Scripts/python.exe scripts/check_dist_arch.py dist/Xiao8 \
              --expect-arch "${{ matrix.expect_arch }}" --expect-platform "${{ matrix.expect_platform }}"
          else
            .venv/bin/python scripts/check_dist_arch.py "$NEKO_NUITKA_RUNTIME_DIR" \
              --expect-arch "${{ matrix.expect_arch }}" --expect-platform "${{ matrix.expect_platform }}"
          fi

      # Nuitka signs macOS app bundles when it creates them. The steps above
      # then add Playwright and plugin payloads inside the bundle, invalidating
      # that seal. Restore a valid ad-hoc signature for the backend artifact;
      # electron-builder applies the configured distribution identity later.
      - name: Re-sign macOS backend after post-processing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Playwright uses .links only for browser-cache install/GC bookkeeping.
          # codesign --deep otherwise mistakes it for a nested bundle.
          rm -rf -- "$NEKO_NUITKA_RUNTIME_DIR/playwright_browsers/.links"
          codesign --force --deep --sign - dist/Xiao8/projectneko_server.app
          codesign --verify --deep --strict dist/Xiao8/projectneko_server.app

      - name: Upload Python backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/Xiao8/
          retention-days: 7
          compression-level: 6

  # ──────────────────────────────────────────────
  # Step 2: Build Electron desktop app
  # ──────────────────────────────────────────────
  build-electron:
    if: github.repository == 'Project-N-E-K-O/N.E.K.O' || inputs.allow_fork_build
    needs: [version, build-python]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"os":"windows-latest","platform":"win","portable_key":"win","builder_platform":"windows","portable_dir":"dist/win-unpacked","python_artifact":"python-backend-win","electron_args":"--win","artifact_name":"desktop-win-x64"}]' || '[{"os":"windows-latest","platform":"win","portable_key":"win","builder_platform":"windows","portable_dir":"dist/win-unpacked","python_artifact":"python-backend-win","electron_args":"--win","artifact_name":"desktop-win-x64"},{"os":"macos-15-intel","platform":"mac-x64","portable_key":"mac_x64","builder_platform":"macos","portable_arch_args":"--x64","portable_dir":"dist/portable-stage/mac/N.E.K.O.app","python_artifact":"python-backend-mac-x64","electron_args":"--mac --x64","artifact_name":"desktop-mac-x64"},{"os":"macos-latest","platform":"mac-arm64","portable_key":"mac_arm64","builder_platform":"macos","portable_arch_args":"--arm64","portable_dir":"dist/portable-stage/mac-arm64/N.E.K.O.app","python_artifact":"python-backend-mac-arm64","electron_args":"--mac --arm64","artifact_name":"desktop-mac-arm64"},{"os":"ubuntu-latest","platform":"linux","portable_key":"linux_x64","builder_platform":"linux","portable_arch_args":"--x64","portable_dir":"dist/portable-stage/linux-unpacked","python_artifact":"python-backend-linux","electron_args":"--linux","artifact_name":"desktop-linux-x64"},{"os":"ubuntu-24.04-arm","platform":"linux-arm64","portable_key":"linux_arm64","builder_platform":"linux","portable_arch_args":"--arm64","builder_target_args":"-c.linux.target=AppImage -c.linux.target=deb -c.linux.target=tar.gz","skip_portable_channel":true,"portable_dir":"dist/portable-stage/linux-arm64-unpacked","python_artifact":"python-backend-linux-arm64","electron_args":"--linux --arm64","artifact_name":"desktop-linux-arm64","experimental":true}]') }}

    runs-on: ${{ matrix.os }}
    # 同 build-python：linux-arm64 是试验腿，失败不应让 nightly 发布判红
    # （nightly 的门是 `needs.build-electron.result != 'failure'`）。
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 180
    steps:
      - name: Checkout Electron frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.electron_repo || 'Project-N-E-K-O/N.E.K.O.-PC' }}
          ref: ${{ inputs.electron_ref || 'main' }}
          token: ${{ secrets.ELECTRON_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: electron-app

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json

      - name: Download Python backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.python_artifact }}
          path: electron-app/bin

      - name: Make server binary executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x electron-app/bin/projectneko_server
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            chmod +x electron-app/bin/projectneko_server.app/Contents/MacOS/projectneko_server
          fi

      # --- Cache Electron binary to avoid download failures ---
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/Library/Caches/electron
            ~/.cache/electron
          key: electron-${{ matrix.os }}-${{ matrix.platform }}-${{ hashFiles('electron-app/package-lock.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-${{ matrix.platform }}-

      - name: Install npm dependencies
        working-directory: electron-app
        shell: bash
        run: |
          npm ci || npm install
          # The electron repo's own `dist*` scripts go through `npm run`, so its
          # scripts/build-electron-distribution.js can spawn a bare
          # `electron-builder` and let npm's PATH injection find it. We invoke
          # that script with plain `node`, which gets no such PATH — the spawn
          # then dies with ENOENT. Put the local bin dir on PATH ourselves so
          # every call site in this job resolves the same binary npm would.
          # Not $PWD: on the Windows runner bash reports a /d/a/... MSYS path,
          # which the runner cannot put on the process PATH.
          echo "$GITHUB_WORKSPACE/electron-app/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Update version in package.json
        working-directory: electron-app
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.RELEASE_VERSION.replace(/^[^0-9]*/, '');
            if (!/^\d+\.\d+\.\d+/.test(pkg.version)) {
              pkg.version = '0.0.0-' + pkg.version;
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated version to:', pkg.version);
          "

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg \
            fakeroot

      # Explicitly disable macOS code signing via package.json patch
      # N.E.K.O.-PC has hardenedRuntime, afterSign (notarize.js), and entitlements
      # which all require a valid signing identity; disable them all for CI builds
      - name: Disable macOS code signing
        if: runner.os == 'macOS' && (github.event_name == 'schedule' || inputs.skip_signing == 'true')
        working-directory: electron-app
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.build = pkg.build || {};
            pkg.build.mac = pkg.build.mac || {};
            pkg.build.mac.identity = null;
            pkg.build.mac.hardenedRuntime = false;
            delete pkg.build.mac.entitlements;
            delete pkg.build.mac.entitlementsInherit;
            delete pkg.build.afterSign;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('macOS code signing fully disabled');
          "

      # Linux .deb requires a maintainer email; N.E.K.O.-PC package.json
      # only has author name without email, so patch it here
      - name: Set Linux deb maintainer
        if: runner.os == 'Linux'
        working-directory: electron-app
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.build = pkg.build || {};
            pkg.build.linux = pkg.build.linux || {};
            pkg.build.linux.maintainer = 'Project N.E.K.O. <projectneko@yahoo.com>';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Set Linux deb maintainer');
          "

      # Windows Portable is a ZIP containing the complete unpacked Electron
      # directory. Building --dir gives the updater stable file boundaries.
      - name: Build Electron app (Windows ZIP Portable directory, unsigned)
        if: runner.os == 'Windows' && (github.event_name == 'schedule' || inputs.skip_signing == 'true')
        working-directory: electron-app
        run: node scripts/build-electron-distribution.js windows --dir --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build Electron app (Windows ZIP Portable directory, signed)
        if: runner.os == 'Windows' && github.event_name != 'schedule' && inputs.skip_signing != 'true'
        working-directory: electron-app
        run: node scripts/build-electron-distribution.js windows --dir --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # `builder_target_args` 只有 linux-arm64 非空。N.E.K.O.-PC 的 package.json 把
      # build.linux.target 三个 target 的 arch 写死成 ["x64"]，而 electron-builder 的
      # computeArchToTargetNamesMap 只在 CLI 显式给了 target 名时才无视配置里的 arch：
      # 光传 `--arm64` 会解析成 {arm64: [], x64: [AppImage, deb, tar.gz]}，也就是在
      # arm64 机器上打出一套 x64 产物，文件名和真正的 x64 腿逐字相同，在 nightly 扁平的
      # release/ 目录里互相覆盖。重复的 -c.linux.target= 把目标列表整个换掉，解析结果
      # 才是 {arm64: [AppImage, deb, tar.gz]}；x64 腿传空串，行为不变。
      - name: Build Electron app (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: electron-app
        run: node scripts/build-electron-distribution.js ${{ matrix.builder_platform }} ${{ matrix.portable_arch_args }} ${{ matrix.builder_target_args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (github.event_name == 'schedule' || inputs.skip_signing == 'true') && 'false' || 'true' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Build a separate marked unpacked tree for the self-managed Portable
      # channel. On macOS the marker is added by afterPack before signing.
      # skip_portable_channel 只有 linux-arm64 为 true：N.E.K.O.-PC 的 getTargetKey()
      # 对 linux + arm64 返回 null，下面两个 create-portable-update.js 步骤会直接抛
      # `Unsupported Portable target: linux-arm64` / `Invalid AppImage target`。把 arm64
      # 接进 Portable 自更新通道要同时改闭源的 N.E.K.O.-PC（targetKey、manifest 资产名
      # 正则、客户端解析），是独立决定；在那之前 arm64 只出 AppImage/deb/tar.gz 原始
      # 产物，不进增量自更新。这一步的 --dir 产物只被那两步消费，一并跳过。
      - name: Build Electron app (macOS/Linux Portable directory)
        if: runner.os != 'Windows' && matrix.skip_portable_channel != true
        working-directory: electron-app
        run: node scripts/build-electron-distribution.js ${{ matrix.builder_platform }} --dir ${{ matrix.portable_arch_args }} --publish never -c.directories.output=dist/portable-stage
        env:
          NEKO_PORTABLE_BUILD: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (github.event_name == 'schedule' || inputs.skip_signing == 'true') && 'false' || 'true' }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Download previous Portable manifests
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.previous_portable_release != '') && matrix.skip_portable_channel != true
        working-directory: electron-app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTABLE_KEY: ${{ matrix.portable_key }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_portable_release }}
        run: |
          set -euo pipefail
          mkdir -p previous-portable
          if [[ -z "$PREVIOUS_RELEASE_TAG" ]]; then
            PREVIOUS_RELEASE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[] | select(.draft | not) | select(.prerelease | not) | select(.tag_name != env.GITHUB_REF_NAME)][0].tag_name // empty' \
              2>/dev/null || true)"
          fi
          if [[ -z "$PREVIOUS_RELEASE_TAG" ]]; then
            echo "No preceding stable release found; this release will contain a full package only"
            exit 0
          fi
          RELEASE_ENDPOINT="repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIOUS_RELEASE_TAG}"
          PREVIOUS_URL="$(gh api "$RELEASE_ENDPOINT" \
            --jq "[.assets[] | select(.name | endswith(\"_${PORTABLE_KEY}_manifest.json\"))][0].browser_download_url // empty" \
            2>/dev/null || true)"
          if [[ -n "$PREVIOUS_URL" ]]; then
            curl --fail --location --retry 3 "$PREVIOUS_URL" \
              --output "previous-portable/previous-${PORTABLE_KEY}-manifest.json"
            echo "Downloaded previous ${PORTABLE_KEY} Portable manifest from release ${PREVIOUS_RELEASE_TAG}"
          else
            echo "No previous ${PORTABLE_KEY} Portable manifest found in release ${PREVIOUS_RELEASE_TAG}; this release will contain a full package only"
          fi
          if [[ "$PORTABLE_KEY" == linux_* ]]; then
            APPIMAGE_URL="$(gh api "$RELEASE_ENDPOINT" \
              --jq '[.assets[] | select(.name | endswith("_" + env.PORTABLE_KEY + "_appimage_manifest.json"))][0].browser_download_url // empty' \
              2>/dev/null || true)"
            if [[ -n "$APPIMAGE_URL" ]]; then
              curl --fail --location --retry 3 "$APPIMAGE_URL" \
                --output "previous-portable/previous-${PORTABLE_KEY}_appimage-manifest.json"
            fi
          fi

      # 三个 Portable 更新步骤都用 `PREVIOUS_ARGS` 这个可能为空的数组来传可选的
      # `--previous`。展开必须写成 `${PREVIOUS_ARGS[@]+"${PREVIOUS_ARGS[@]}"}`：
      # macOS runner 的 /bin/bash 是 3.2，在 `set -u` 下展开空数组会直接报
      # `PREVIOUS_ARGS[@]: unbound variable`（bash 4.4 才修）。写成 `"${PREVIOUS_ARGS[@]}"`
      # 在 Linux / Git Bash（bash 5）上是绿的，只有 macOS 两个 job 会红 —— #2439 就是
      # 这样让 nightly 桌面构建的 mac-x64 / mac-arm64 连续红了下去。
      - name: Create Windows Portable full and differential update assets
        if: runner.os == 'Windows'
        working-directory: electron-app
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_ARGS=()
          if [[ -f previous-portable/previous-win-manifest.json ]]; then
            PREVIOUS_ARGS=(--previous previous-portable/previous-win-manifest.json)
          fi
          PORTABLE_VERSION="$(node -p "require('./package.json').version")"
          node scripts/create-portable-update.js \
            --dir dist/win-unpacked \
            --version "$PORTABLE_VERSION" \
            --out dist/portable-update \
            ${PREVIOUS_ARGS[@]+"${PREVIOUS_ARGS[@]}"}

      - name: Create macOS/Linux Portable directory update assets
        if: runner.os != 'Windows' && matrix.skip_portable_channel != true
        working-directory: electron-app
        shell: bash
        env:
          PORTABLE_KEY: ${{ matrix.portable_key }}
          PORTABLE_DIR: ${{ matrix.portable_dir }}
        run: |
          set -euo pipefail
          PREVIOUS_ARGS=()
          PREVIOUS="previous-portable/previous-${PORTABLE_KEY}-manifest.json"
          if [[ -f "$PREVIOUS" ]]; then PREVIOUS_ARGS=(--previous "$PREVIOUS"); fi
          PORTABLE_VERSION="$(node -p "require('./package.json').version")"
          PLATFORM=linux
          ARCH=x64
          [[ "$PORTABLE_KEY" == mac_* ]] && PLATFORM=darwin
          # mac_arm64 与 linux_arm64 共用同一条后缀判据，别退回逐个平台列举。
          [[ "$PORTABLE_KEY" == *_arm64 ]] && ARCH=arm64
          node scripts/create-portable-update.js \
            --dir "$PORTABLE_DIR" \
            --platform "$PLATFORM" \
            --arch "$ARCH" \
            --version "$PORTABLE_VERSION" \
            --out dist/portable-update \
            ${PREVIOUS_ARGS[@]+"${PREVIOUS_ARGS[@]}"}

      - name: Create Linux AppImage full and differential update assets
        if: runner.os == 'Linux' && matrix.skip_portable_channel != true
        working-directory: electron-app
        shell: bash
        env:
          PORTABLE_KEY: ${{ matrix.portable_key }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPIMAGES=(dist/*.AppImage)
          [[ ${#APPIMAGES[@]} -eq 1 ]] || { echo "Expected exactly one AppImage"; exit 1; }
          PREVIOUS_ARGS=()
          PREVIOUS="previous-portable/previous-${PORTABLE_KEY}_appimage-manifest.json"
          if [[ -f "$PREVIOUS" ]]; then PREVIOUS_ARGS=(--previous "$PREVIOUS"); fi
          PORTABLE_VERSION="$(node -p "require('./package.json').version")"
          node scripts/create-portable-update.js \
            --appimage "${APPIMAGES[0]}" \
            --arch "${PORTABLE_KEY#linux_}" \
            --version "$PORTABLE_VERSION" \
            --out dist/portable-update \
            ${PREVIOUS_ARGS[@]+"${PREVIOUS_ARGS[@]}"}

      - name: List build output
        working-directory: electron-app/dist
        shell: bash
        run: |
          echo "=== Build artifacts ==="
          ls -lahR . || true

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            electron-app/dist/*.exe
            electron-app/dist/*.dmg
            electron-app/dist/*.zip
            electron-app/dist/*.AppImage
            electron-app/dist/*.deb
            electron-app/dist/*.tar.gz
            electron-app/dist/*.blockmap
            electron-app/dist/latest*.yml
            electron-app/dist/portable-update/*
          if-no-files-found: warn
          retention-days: 14

  # ──────────────────────────────────────────────
  # Step 3: Publish Nightly Release
  # ──────────────────────────────────────────────
  nightly:
    if: (github.repository == 'Project-N-E-K-O/N.E.K.O' || inputs.allow_fork_build) && github.event_name != 'push' && always() && !cancelled() && needs.build-python.result == 'success' && needs.build-electron.result != 'failure'
    needs: [version, build-python, build-electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release
          VERSION="$RELEASE_VERSION"

          # Zip Python backend artifacts per platform
          for dir in artifacts/python-backend-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            echo "Zipping $name ..."
            (cd "$dir" && zip -qr "../../release/${name}-${VERSION}.zip" .)
          done

          # Collect Electron desktop artifacts
          find artifacts/desktop-* -type f \( \
            -name "*.dmg" -o -name "*.zip" \
            -o -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \
            -o -name "latest*.yml" -o -name "*_manifest.json" -o -name "*_delta.bin" \
          \) -exec cp {} release/ \; 2>/dev/null || true

          echo "=== Nightly release files ==="
          ls -lah release/

      - name: Sign Portable manifests
        env:
          PORTABLE_UPDATE_MANIFEST_ED25519_PRIVATE_KEY: ${{ secrets.PORTABLE_UPDATE_MANIFEST_ED25519_PRIVATE_KEY }}
          PORTABLE_MANIFEST_SIGNING_KEY_ID: portable-manifest-2026-07
        run: |
          set -euo pipefail
          if [[ -z "${PORTABLE_UPDATE_MANIFEST_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::PORTABLE_UPDATE_MANIFEST_ED25519_PRIVATE_KEY is required to publish Portable updates"
            exit 1
          fi
          umask 077
          key_path="$(mktemp "${RUNNER_TEMP}/portable-manifest-key.XXXXXX")"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$PORTABLE_UPDATE_MANIFEST_ED25519_PRIVATE_KEY" > "$key_path"
          shopt -s nullglob
          manifests=(release/*_manifest.json)
          if (( ${#manifests[@]} == 0 )); then
            echo "::error::No Portable manifests found to sign"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            raw_signature="${manifest}.rawsig"
            openssl pkeyutl -sign -rawin -inkey "$key_path" -in "$manifest" -out "$raw_signature"
            signature="$(base64 < "$raw_signature" | tr -d '\r\n')"
            rm -f "$raw_signature"
            jq -n --arg key_id "$PORTABLE_MANIFEST_SIGNING_KEY_ID" --arg signature "$signature" \
              '{schemaVersion: 1, keyId: $key_id, signature: $signature}' > "${manifest}.sig"
          done

      - name: Delete old nightly release
        if: ${{ !inputs.windows_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

      - name: Create nightly release
        if: ${{ !inputs.windows_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          REQUESTED_SKIP_SIGNING: ${{ inputs.skip_signing }}
        run: |
          VERSION="$RELEASE_VERSION"
          DATE=$(date +%Y-%m-%d)
          if [[ "$REQUESTED_SKIP_SIGNING" == "true" || "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            SIGNING_NOTE="unsigned"
          else
            SIGNING_NOTE="signed"
          fi

          # linux-arm64 是 continue-on-error 的试验腿，红了不会挡住这一步发布，
          # 但那时它的 artifact 根本没上传。表格行必须跟着实际产物走，否则发布说明
          # 会一直挂着两条下不到的下载。判据用 artifact 目录名（本 workflow 矩阵里
          # 自己定的 artifact_name），不猜 electron-builder 的输出文件名。
          NL=$'\n'
          ARM64_DESKTOP_ROW=""
          ARM64_BACKEND_ROW=""
          if [ -d "artifacts/desktop-linux-arm64" ]; then
            ARM64_DESKTOP_ROW="${NL}| Linux arm64 (experimental) | \`N.E.K.O-*-arm64.AppImage\` / \`.deb\` / \`.tar.gz\` |"
          fi
          if [ -d "artifacts/python-backend-linux-arm64" ]; then
            ARM64_BACKEND_ROW="${NL}| Linux arm64 (experimental) | \`python-backend-linux-arm64-*.zip\` |"
          fi

          gh release create nightly release/* \
            --title "Nightly Build ${DATE}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --notes "$(cat <<NOTES
          ## Nightly Build ${DATE} (${VERSION})

          > ⚠️ This is a **${SIGNING_NOTE}** nightly build for testing purposes.
          >
          > 🍎 **macOS users:** If you see *"N.E.K.O is damaged and can't be opened"*, run this in Terminal:
          > \`\`\`bash
          > xattr -cr /path-to/N.E.K.O.app
          > \`\`\`

          ### Desktop App (Electron + Python backend)
          | Platform | File |
          |----------|------|
          | Windows x64 | \`N.E.K.O_*_win.zip\` (Portable) |
          | macOS Intel | \`N.E.K.O-*.dmg\` / \`.zip\` |
          | macOS Apple Silicon | \`N.E.K.O-*-arm64.dmg\` / \`.zip\` |
          | Linux x64 | \`N.E.K.O-*.AppImage\` / \`.deb\` / \`.tar.gz\` |${ARM64_DESKTOP_ROW}

          ### Python Backend Only (standalone, no Electron)
          | Platform | File |
          |----------|------|
          | Windows x64 | \`python-backend-win-*.zip\` |
          | macOS Intel | \`python-backend-mac-x64-*.zip\` |
          | macOS Apple Silicon | \`python-backend-mac-arm64-*.zip\` |
          | Linux x64 | \`python-backend-linux-*.zip\` |${ARM64_BACKEND_ROW}

          ---
          Built from [\`${VERSION}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          NOTES
          )"

      - name: Create or update Windows nightly release
        if: ${{ inputs.windows_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          REQUESTED_SKIP_SIGNING: ${{ inputs.skip_signing }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          DATE=$(date +%Y-%m-%d)
          if [[ "$REQUESTED_SKIP_SIGNING" == "true" ]]; then
            SIGNING_NOTE="Unsigned"
          else
            SIGNING_NOTE="Signed"
          fi
          if gh release view nightly >/dev/null 2>&1; then
            while IFS= read -r asset; do
              case "$asset" in
                python-backend-win-*.zip|N.E.K.O_*_win.zip|N.E.K.O_*_win_delta.zip|N.E.K.O_*_win_delta.bin|N.E.K.O_*_win_manifest.json|N.E.K.O_*_win_manifest.json.sig)
                  gh release delete-asset nightly "$asset" --yes
                  ;;
              esac
            done < <(gh release view nightly --json assets --jq '.assets[].name')
            gh release upload nightly release/* --clobber
          else
            gh release create nightly release/* \
              --title "Nightly Build ${DATE}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --notes "${SIGNING_NOTE} Windows-only nightly build (${VERSION})."
          fi
