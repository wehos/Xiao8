[build-system]
requires = ["hatchling", "setuptools<70"]
build-backend = "hatchling.build"

[project]
name = "N.E.K.O"
dynamic = ["version"]
description = "N.E.K.O. Desktop"
readme = "README.MD"
requires-python = "==3.11.*"
dependencies = [
  "fastapi~=0.115.9",
  "websockets~=15.0.1",
  "soxr~=0.5.0",
  "numpy~=1.26.4",
  "websocket-client~=1.8.0",
  "jinja2",
  "dashscope==1.25.4",
  "python-multipart",
  "pillow",
  "regex",
  "pyautogui",
  "backoff",
  "toml",
  "openai",
  "google-genai>=1.56.0",
  "anthropic",
  "uvicorn",
  "pyobjc; sys_platform == 'darwin'",
  "pytesseract",
  "pywin32; sys_platform == 'win32'",
  "pywinauto; sys_platform == 'win32'",
  "pygetwindow; sys_platform == 'win32'",
  # pyrnnoise 的 macOS wheel 标 macosx_15_0_universal2，在 Intel Mac 上装得上，但
  # 包里的 librnnoise.dylib 只有 arm64 一个 slice，也没有 sdist 可回退编译。装上只
  # 会让 --include-package-data=pyrnnoise 把一个 arm64 dylib 打进 mac-x64 产物，
  # 被 scripts/check_dist_arch.py 判红。utils/audio_processor.py 是唯一消费方，走
  # ctypes 加载、find_spec 落空时降级为不降噪，所以 Intel Mac 上直接不装。
  "pyrnnoise>=0.4.3 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "aiotieba>=4.7.1",
  "beautifulsoup4>=4.12.0",
  "bilibili-api-dev==18.0.0a1",
  # Twitch read-only Helix/EventSub integration. OAuth Device Code Flow remains
  # in-tree because TwitchIO 3.2 does not expose the client-secret-free flow.
  "twitchio==3.2.2",
  "googletrans>=4.0.2",
  "translatepy",
  "tomli>=2.3.0",
  "tomli-w>=1.2.0",
  # sts2_autoplay/strategy_parser.py parses YAML strategy frontmatter. Declared
  # explicitly rather than leaning on the Bilibili SDK's transitive pull, so a
  # change upstream can't silently break strategy loading in the packaged build.
  "pyyaml>=6.0",
  # plugin_cli/install_plan.py parses package versions at module import time.
  "packaging>=25.0",
  # ⚠ 严禁再加 loguru / structlog / logbook。日志统一走 utils.logger_config。
  # lint 守门：scripts/check_no_loguru.py（CI: .github/workflows/analyze.yml）
  "pyzmq>=27.1.0",
  "ormsgpack>=1.4.0",
  "browser-use>=0.11.0",
  "cryptography>=45.0.6",
  "python-dotenv>=1.2.1",
  "requests>=2.32.5",
  "sqlalchemy>=2.0.0",
  "qrcode>=8.2",
  "httpx[socks]>=0.28.1",
  "psutil>=7.0.0",
  "portalocker>=2.10.1",
  "pyncm-async==1.8.1",
  "tornado>=6.5.4",
  "jmespath>=1.1.0",
  "orjson>=3.11.8",
  "playwright>=1.58.0",
  # memory-evidence-rfc §3.6.6: tiktoken for persona/reflection render
  # token budgeting (o200k_base encoding). PR-1 pins the dep; PR-3 ships
  # utils/tokenize.py and wires render-time counting.
  "tiktoken>=0.7.0",
  "cachetools>=5.3",
  # Local memory embeddings (memory/embeddings.py): ONNX + tokenizer. CPU
  # SIMD detection reads numpy's __cpu_features__ (compiled-C probe) — we do
  # NOT use py-cpuinfo, whose low-level CPU probe runs a generated native
  # routine in a child process that Huorong's heuristic flags as a trojan.
  "onnxruntime",
  "tokenizers",
  # Cross-platform screen capture retained for marketplace plugins and potential
  # host computer-use features (mss is tiny, <1MB).
  "mss",
  "dxcam ; sys_platform == 'win32'",
  # Linux X11 window enumeration / geometry for marketplace plugins. Falls back
  # to the `wmctrl` subprocess
  # when this dependency is unavailable. Skipped on Windows/macOS
  # to keep dev installs lean.
  "python-xlib ; sys_platform == 'linux'",
  # NOTE: RapidOCR lives in [dependency-groups] galgame below so plain
  # `uv sync` keeps dev installs lean while packaged builds can still bundle
  # the OCR backend with `uv sync --group galgame`.
  "imagehash>=4.3.2",
  # VMC Protocol sender (main_logic/vmc_sender.py): streams VRM humanoid bone
  # poses + blendshape weights via OSC over UDP to external VMC-compatible
  # receivers (VSeeFace / waidayo / iFacialMocap / Unity with EVMC / Warudo). Default
  # 127.0.0.1:39539.
  "python-osc>=1.9.0",
]

[tool.hatch.version]
path = "config/application.py"
pattern = '''^APP_VERSION\s*=\s*["'](?P<version>[^"']+)["']'''

[project.scripts]
neko-plugin = "plugin.neko_plugin_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "app",
  "launcher_core",
  "brain",
  "config",
  "main_logic",
  "main_routers",
  "memory",
  "plugin",
  "steamworks",
  "utils",
]
exclude = [
  "plugin/plugins",
  "main_logic/asr_client/endpointing/models/*.onnx",
  "main_logic/asr_client/endpointing/models/*.part",
  "main_logic/asr_client/speaker_shadow/models/*.onnx",
  "main_logic/asr_client/speaker_shadow/models/*.part",
]

[tool.hatch.build.targets.sdist]
include = [
  "app",
  "launcher_core",
  "brain",
  "config",
  "main_logic",
  "main_routers",
  "memory",
  "plugin",
  "steamworks",
  "utils",
  "static",
  "templates",
  "assets",
  "launcher.py",
  "README.MD",
  "LICENSE",
]
exclude = [
  "plugin/plugins",
  "main_logic/asr_client/endpointing/models/*.onnx",
  "main_logic/asr_client/endpointing/models/*.part",
  "main_logic/asr_client/speaker_shadow/models/*.onnx",
  "main_logic/asr_client/speaker_shadow/models/*.part",
]

# pyncm-async 已从 PyPI 下架（连同上游 pyncm 与 GitHub 仓库），改为本地 wheel 安装。
# music plugin 已对该依赖做了 try/except 防御（main_routers/music_router.py），
# 但 deps/*.whl 本地存档可保证 uv lock/sync 在无网/CI 环境下仍可复现。
[tool.uv.sources]
pyncm-async = { path = "./deps/pyncm_async-1.8.1-py3-none-any.whl" }
rapidocr-pillow = { path = "./deps/rapidocr_pillow" }

# python3-xlib (0.15, a stale 2016 py3 fork that pyautogui/mouseinfo pin) and
# python-xlib (0.33, the maintained fork retained for marketplace plugin X11
# enumeration) both install into the same `Xlib` import namespace — having
# both means whichever lands last wins, a latent Linux import hazard. We block
# python3-xlib so the single, modern python-xlib provides `Xlib` for everyone;
# its API is a strict superset, so pyautogui's `from Xlib...` resolves fine.
[tool.uv]
override-dependencies = [
    "python3-xlib ; sys_platform == 'never'",
]
# uv 的 universal 解析默认不检查各平台是否真有可安装的 wheel。onnxruntime 就因此被
# 锁成 1.25.0 —— 那一版在 PyPI 上没有 macOS x86_64 wheel（1.23.2 是该平台最后一版），
# 于是 nightly 的 mac-x64 腿自 2026-09-04 换上 macos-15-intel runner 后，每晚都挂在
# uv sync。把 darwin+x86_64 列进 required-environments，uv 会为它单独分叉解析（锁里
# 同时存在 onnxruntime 1.23.2 与 1.25.0），Intel Mac 因此保住本地向量记忆、端点检测、
# 声纹与 OCR，而不是用环境标记把 onnxruntime 整块砍掉。副作用是这行同时变成一道门：
# 日后哪个依赖在 Intel Mac 上无解，`uv lock` 当场失败，而不是等到 nightly 才炸。
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "nest-asyncio>=1.6.0",
    "pyinstaller==6.12.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.7.2",
    # 打乱用例顺序，暴露隐藏的用例间顺序依赖。日常 CI 用 pytest.ini 里钉死的
    # seed 跑（确定性），另有 .github/workflows/random-order-tests.yml 定时用
    # 随机 seed 单独跑、单独报，不挡任何人的 PR。
    "pytest-randomly>=4.1.0",
    # tests/unit 是 24000+ 条用例的单进程串行跑，Windows CI 上要 19 分钟，逼近
    # 25 分钟的 job 上限。用 `-n auto --dist loadfile` 按文件分发到多个 worker：
    # 文件内顺序不变（loadfile 保证整个文件在同一个 worker 上按序跑），所以
    # pytest.ini 里钉死 seed 的确定性和 tests/unit/conftest.py 的进程级全局清理
    # 都还成立；跨文件的顺序依赖本来就是 random-order-tests.yml 在抓的东西。
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.4",
]
# Marketplace Galgame native deps. NOT installed by default `uv sync` — keeps
# dev installs lean. Build scripts add `--group galgame` so packaged
# Nuitka/PyInstaller dist bundles the host-side dependency cohort.
# The local rapidocr-pillow fork keeps the rapidocr_onnxruntime import package
# but removes the opencv/shapely transitive dependency chain.
galgame = [
    "rapidocr-pillow",
]

# ─────────────────────────────────────────────────────────────────────────────
# Ruff: enforce zero-blocking-call policy in async def bodies.
# Covers: time.sleep / requests / urllib.request / subprocess.* (run, Popen…).
# Gaps (threading.Thread.join timeout, queue.Queue.get, threading.Event.wait
# timeout, raw socket.recv/send/accept/connect) are caught by the companion
# script scripts/check_async_blocking.py which the CI Analyze job also runs.
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
extend-exclude = [
  "frontend",
  "dist",
  ".venv",
]

[tool.ruff.lint]
select = [
  "ASYNC210",  # blocking HTTP call (requests / urllib / httpx.Client)
  "ASYNC220",  # create-subprocess (Popen) in async function
  "ASYNC221",  # subprocess.run / call / check_output / check_call
  "ASYNC222",  # Popen.wait / Popen.communicate
  "ASYNC251",  # time.sleep in async function
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
