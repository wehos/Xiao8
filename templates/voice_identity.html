<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="voiceIdentity.pageTitle">Owner 声纹</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="/static/i18n-i18next.js?v={{ static_asset_version }}"></script>
    <script src="/static/theme-manager.js?v={{ static_asset_version }}"></script>
    <link rel="stylesheet" href="/static/css/voice_identity.css?v={{ static_asset_version }}">
    <link rel="stylesheet" href="/static/css/window_controls.css?v={{ static_asset_version }}">
    <link rel="stylesheet" href="/static/css/dark-mode.css?v={{ static_asset_version }}">
    <script src="/static/common_dialogs.js?v={{ static_asset_version }}" defer></script>
    <script src="/static/js/window_controls.js?v={{ static_asset_version }}" defer></script>
    <script src="/static/js/voice_identity.js?v={{ static_asset_version }}" defer></script>
</head>
<body class="voice-identity-page">
    <main class="voice-identity-shell container">
        <header class="voice-identity-header container-header page-title-bar">
            <h2 data-i18n="voiceIdentity.pageTitle" data-text="Owner 声纹">Owner 声纹</h2>
            <div class="neko-window-controls">
                <button type="button" class="neko-window-control-btn"
                    data-neko-window-control="pin"
                    data-i18n-title="common.pinWindow"
                    data-i18n-aria="common.pinWindow"
                    title="置顶窗口"
                    aria-label="置顶窗口"
                    aria-pressed="false"
                    hidden>
                    <span class="neko-window-pin-icon" aria-hidden="true"></span>
                </button>
                <button type="button" class="neko-window-control-btn"
                    data-neko-window-control="minimize"
                    data-i18n-title="common.minimize"
                    data-i18n-aria="common.minimize"
                    title="最小化"
                    aria-label="最小化">
                    <span class="neko-window-minimize-icon"></span>
                </button>
                <button type="button" class="neko-window-control-btn"
                    data-neko-window-control="maximize"
                    data-i18n-title="common.maximize"
                    data-i18n-aria="common.maximize"
                    title="最大化"
                    aria-label="最大化">
                    <span class="neko-window-maximize-icon"></span>
                </button>
                <button type="button" class="close-page-btn"
                    data-neko-window-control="close"
                    data-i18n-title="common.close"
                    data-i18n-aria="common.close"
                    title="关闭"
                    aria-label="关闭">
                    <img src="/static/icons/close_button.png" alt=""
                        data-i18n-alt="common.close" draggable="false">
                </button>
            </div>
        </header>

        <div class="container-content">
            <div class="voice-identity-content">
                <section class="status-card" aria-labelledby="profile-status-title">
                    <div class="status-copy">
                        <span class="status-dot" id="voice-identity-status-dot" aria-hidden="true"></span>
                        <div>
                            <h2 id="profile-status-title" data-i18n="voiceIdentity.profileStatus">声纹状态</h2>
                            <p id="voice-identity-profile-status" role="status"
                                aria-live="polite" aria-atomic="true"
                                data-i18n="voiceIdentity.profileMissing">尚未录入 Owner 声纹</p>
                        </div>
                    </div>
                </section>

                <section class="enrollment-card" id="voice-identity-enrollment"
                    aria-labelledby="voice-identity-enrollment-title">
                    <div class="enrollment-copy">
                        <p class="eyebrow" data-i18n="voiceIdentity.localOnly">仅在本机处理</p>
                        <h2 id="voice-identity-enrollment-title" tabindex="-1"
                            data-i18n="voiceIdentity.privacyTitle">四段短语音，完成本机声纹录入</h2>
                        <p class="enrollment-help" data-i18n="voiceIdentity.privacyBody">
                            使用同一麦克风，以正常音量说四句不同的完整话。语音仅在本机处理，验证成功后才会加密保存声纹。
                        </p>
                        <ul class="enrollment-hints" aria-label="录音提示"
                            data-i18n-aria="voiceIdentity.recordingHints">
                            <li data-i18n="voiceIdentity.hintSameMicrophone">保持使用同一麦克风</li>
                            <li data-i18n="voiceIdentity.hintNormalVolume">使用正常音量</li>
                            <li data-i18n="voiceIdentity.hintDifferentSentence">每段说一句不同的完整话</li>
                        </ul>
                    </div>
                    <div class="step-progress" aria-label="声纹录入进度"
                        data-i18n-aria="voiceIdentity.progressLabel">
                        <span class="step-dot current" data-voice-segment="1">1</span>
                        <span class="step-line" aria-hidden="true"></span>
                        <span class="step-dot" data-voice-segment="2">2</span>
                        <span class="step-line" aria-hidden="true"></span>
                        <span class="step-dot" data-voice-segment="3">3</span>
                        <span class="step-line" aria-hidden="true"></span>
                        <span class="step-dot verification" data-voice-segment="4">4</span>
                    </div>
                    <p class="progress-label" id="voice-identity-progress-label">第 1/4 段</p>
                    <p class="phase-label" id="voice-identity-phase" aria-live="polite"></p>
                    <div class="reading-prompt" id="voice-identity-reading-prompt"
                        role="status" aria-live="polite" aria-atomic="true" hidden>
                        <span class="reading-prompt-label"
                            data-i18n="voiceIdentity.readingPromptLabel">请朗读</span>
                        <q id="voice-identity-reading-text"></q>
                    </div>
                    <p class="verification-help" id="voice-identity-verification-help"
                        data-i18n="voiceIdentity.verificationScoreHelp" hidden>
                        结果取本次录音三个检查点中的最低值，不代表身份认证准确率。
                    </p>
                    <p class="remaining-label" id="voice-identity-remaining" aria-live="polite"></p>
                    <div class="capture-status" id="voice-identity-capture-status" hidden>
                        <span class="record-icon" aria-hidden="true"></span>
                        <span id="voice-identity-capture-label" role="status"
                            aria-live="polite" aria-atomic="true"
                            data-i18n="voiceIdentity.recording">正在录音…</span>
                        <span class="recording-timer" id="voice-identity-timer" aria-hidden="true"></span>
                    </div>
                    <div class="enrollment-actions">
                        <button type="button" class="primary-button" id="voice-identity-start"
                            data-i18n="voiceIdentity.enrollAndEnable">录入并启用声纹</button>
                        <button type="button" class="secondary-button" id="voice-identity-cancel" hidden
                            data-i18n="voiceIdentity.cancel">取消录入</button>
                    </div>
                </section>

                <section class="profile-card" id="voice-identity-profile-controls"
                    aria-labelledby="voice-filter-title" hidden>
                    <div class="filter-row">
                        <div>
                            <h2 id="voice-filter-title" data-i18n="voiceIdentity.filterLabel">Owner 声纹过滤</h2>
                            <p id="voice-filter-help" data-i18n="voiceIdentity.filterHelp">
                                仅作用于独立 ASR；短语音、不确定结果或检测异常都会正常放行。
                            </p>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="voice-identity-filter"
                                aria-labelledby="voice-filter-title"
                                aria-describedby="voice-filter-help">
                            <span class="switch-track" aria-hidden="true"></span>
                        </label>
                    </div>
                    <div class="profile-actions">
                        <button type="button" class="secondary-button" id="voice-identity-reenroll"
                            data-i18n="voiceIdentity.reenroll">重新录入</button>
                        <button type="button" class="danger-button" id="voice-identity-delete"
                            data-i18n="voiceIdentity.delete">删除声纹</button>
                    </div>
                </section>
                <p id="voice-identity-message" class="enrollment-message"
                    role="status" aria-live="polite" aria-atomic="true"></p>
            </div>
        </div>
    </main>
</body>
</html>
